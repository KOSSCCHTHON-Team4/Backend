# ============================================================================
# application.yml  (공통 설정 — 모든 프로필에 적용)
#   프로필별 설정은 application-{profile}.yml 에서 오버라이드한다.
#   기본 활성 프로필은 local. 실행 시 SPRING_PROFILES_ACTIVE 로 바꾼다.
#     예) SPRING_PROFILES_ACTIVE=prod java -jar app.jar
# ============================================================================
spring:
  application:
    name: emotion-map

  profiles:
    # 아무것도 지정하지 않으면 local 로 실행된다.
    default: local

  # 이미지 업로드(multipart) 크기 제한. app.storage.max-size-bytes 와 맞춘다(10MB).
  # 초과 시 스프링이 요청을 거부한다(서비스 로직에 도달하기 전 1차 방어).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false          # OSIV 비활성화 (권장)
    hibernate:
      ddl-auto: validate         # 스키마는 Flyway 가 관리한다. JPA 는 검증만.
      # 물리 네이밍: camelCase 필드 -> snake_case 컬럼 (팀 전원 동일하게 강제)
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# 파일(사진) 저장 위치. 각 Entity 에는 이 base 기준의 상대경로만 저장한다.
app:
  storage:
    # 프로필별로 오버라이드. 여기서는 안전한 기본값만 둔다.
    upload-dir: ${APP_UPLOAD_DIR:./uploads}
    # 업로드 검증: 허용 확장자와 최대 크기. 무제한 업로드는 위험하므로 반드시 둔다.
    allowed-extensions: ${APP_STORAGE_ALLOWED_EXT:jpg,jpeg,png}
    max-size-bytes: ${APP_STORAGE_MAX_SIZE_BYTES:10485760}   # 10 MB

  # ------------------------------------------------------------------------
  # 서비스 설정 (A03 GET /config). D03 미정값 — 코드에 기본 숫자를 두지 않는다.
  #   * 공통 파일에는 키 이름과 환경변수 매핑만 둔다. 값이 비면 GET /config 는 503 CONFIGURATION_UNAVAILABLE.
  #   * local 프로필은 API_SPEC 8.2 의 MOCK 예시값을 넣어 개발을 돕는다(운영값 확정 아님).
  #   * prod 는 SERVICE_* 환경변수로만 주입한다.
  # ------------------------------------------------------------------------
  service:
    config-version: ${SERVICE_CONFIG_VERSION:}
    radius-meters: ${SERVICE_RADIUS_METERS:}
    demo-center:
      lat: ${SERVICE_DEMO_CENTER_LAT:}
      lng: ${SERVICE_DEMO_CENTER_LNG:}
    limits:
      memory-content-max-code-points: ${SERVICE_LIMIT_MEMORY_CONTENT_MAX_CODE_POINTS:}
      preference-description-max-code-points: ${SERVICE_LIMIT_PREFERENCE_DESCRIPTION_MAX_CODE_POINTS:}
      report-details-max-code-points: ${SERVICE_LIMIT_REPORT_DETAILS_MAX_CODE_POINTS:}
      image-max-bytes: ${SERVICE_LIMIT_IMAGE_MAX_BYTES:}
      image-max-width: ${SERVICE_LIMIT_IMAGE_MAX_WIDTH:}
      image-max-height: ${SERVICE_LIMIT_IMAGE_MAX_HEIGHT:}
      image-max-pixels: ${SERVICE_LIMIT_IMAGE_MAX_PIXELS:}
      image-upload-ttl-seconds: ${SERVICE_LIMIT_IMAGE_UPLOAD_TTL_SECONDS:}
      analysis-ttl-seconds: ${SERVICE_LIMIT_ANALYSIS_TTL_SECONDS:}
      daily-direct-memory-limit: ${SERVICE_LIMIT_DAILY_DIRECT_MEMORY_LIMIT:}
      default-page-limit: ${SERVICE_LIMIT_DEFAULT_PAGE_LIMIT:}
      max-page-limit: ${SERVICE_LIMIT_MAX_PAGE_LIMIT:}
      max-map-page-limit: ${SERVICE_LIMIT_MAX_MAP_PAGE_LIMIT:}
    auth:
      access-token-ttl-seconds: ${SERVICE_AUTH_ACCESS_TOKEN_TTL_SECONDS:}
      failed-login-limit: ${SERVICE_AUTH_FAILED_LOGIN_LIMIT:}
      login-lock-seconds: ${SERVICE_AUTH_LOGIN_LOCK_SECONDS:}

  # ------------------------------------------------------------------------
  # 서명값(analysisToken·커서) 키. JWT 비밀과 별도 값. 운영은 SIGNING_SECRET 환경변수로만 주입(커밋 금지).
  # ------------------------------------------------------------------------
  signing:
    secret: ${SIGNING_SECRET:local-dev-only-change-me-emotionmap-signing-secret-key-0987654321}

  # ------------------------------------------------------------------------
  # AI 호출 계약(C09). provider=mock 이면 모델 호출 없이 고정 규칙의 가짜 어댑터를 쓴다.
  #   실제 provider/모델/프롬프트 버전은 AI 담당과 합의 후 환경변수로 주입한다.
  # ------------------------------------------------------------------------
  ai:
    provider: ${AI_PROVIDER:mock}
    timeout: ${AI_TIMEOUT:PT8S}
    analysis-model: ${AI_ANALYSIS_MODEL:mock-analysis}
    analysis-prompt-version: ${AI_ANALYSIS_PROMPT_VERSION:mock-v1}
    moderation-model: ${AI_MODERATION_MODEL:mock-moderation}
    moderation-prompt-version: ${AI_MODERATION_PROMPT_VERSION:mock-v1}

  # ------------------------------------------------------------------------
  # JWT 설정. /v1/auth/login 을 제외한 업무 API 는 Bearer 토큰이 필요하다.
  #   * secret 은 절대 커밋 금지. 배포/CI 에서는 JWT_SECRET 환경변수로 주입한다.
  #   * 아래 기본값은 로컬 개발 전용(길이 충분). 실제 배포에선 반드시 교체한다.
  # ------------------------------------------------------------------------
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-emotionmap-jwt-secret-key-1234567890}
    expiration-millis: ${JWT_EXPIRATION_MILLIS:86400000}   # 24h

# API 문서 (springdoc-openapi). 경로를 명시해 팀원이 쉽게 찾도록 둔다.
#   Swagger UI : /swagger-ui.html   |   OpenAPI JSON : /v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 태그/메서드 알파벳 정렬(선택)
    operations-sorter: alpha
    tags-sorter: alpha

# Actuator: 헬스체크 최소 노출
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

logging:
  level:
    root: INFO
