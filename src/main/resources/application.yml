# ============================================================================
# application.yml  (공통 설정 — 모든 프로필에 적용)
#   프로필별 설정은 application-{profile}.yml 에서 오버라이드한다.
#   기본 활성 프로필은 local. 실행 시 SPRING_PROFILES_ACTIVE 로 바꾼다.
#     예) SPRING_PROFILES_ACTIVE=prod java -jar app.jar
# ============================================================================
spring:
  application:
    name: emotion-map

  profiles:
    # 아무것도 지정하지 않으면 local 로 실행된다.
    default: local

  jpa:
    open-in-view: false          # OSIV 비활성화 (권장)
    hibernate:
      ddl-auto: validate         # 스키마는 Flyway 가 관리한다. JPA 는 검증만.
      # 물리 네이밍: camelCase 필드 -> snake_case 컬럼 (팀 전원 동일하게 강제)
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# 파일(사진) 저장 위치. 각 Entity 에는 이 base 기준의 상대경로만 저장한다.
app:
  security:
    password:
      bcrypt-strength: ${PASSWORD_BCRYPT_STRENGTH:}
  account:
    login:
      # 실패 집계 창은 잠금 시간과 별개이며 모든 환경에서 명시한다.
      failed-attempt-window-seconds: ${LOGIN_FAILED_ATTEMPT_WINDOW_SECONDS:}

  storage:
    # 프로필별로 오버라이드. 여기서는 안전한 기본값만 둔다.
    upload-dir: ${APP_UPLOAD_DIR:./uploads}
    # 파일 바이트 외 multipart 오버헤드는 배포 환경에서 양수로 명시한다.
    # 누락·비양수·B+H 오버플로면 신규 이미지 업로드만 CONFIGURATION_UNAVAILABLE(503)으로 닫는다.
    multipart-request-overhead-bytes: ${APP_STORAGE_MULTIPART_REQUEST_OVERHEAD_BYTES:}
    # 신규 파일 생성과 회수에 필요한 운영값. 누락 시 자동 회수와 신규 파일 쓰기를 중단한다.
    cleanup-interval: ${IMAGE_CLEANUP_INTERVAL:}
    cleanup-batch-size: ${IMAGE_CLEANUP_BATCH_SIZE:}

  request-coordination:
    lease-duration: ${REQUEST_COORDINATION_LEASE_DURATION:}

  # ------------------------------------------------------------------------
  # 서비스 설정 (A03 GET /config). D03 미정값 — 코드에 기본 숫자를 두지 않는다.
  #   * 공통 파일에는 키 이름과 환경변수 매핑만 둔다. 값이 비면 GET /config 는 503 CONFIGURATION_UNAVAILABLE.
  #   * local 프로필은 API_SPEC 8.2 의 MOCK 예시값을 넣어 개발을 돕는다(운영값 확정 아님).
  #   * prod 는 SERVICE_* 환경변수로만 주입한다.
  # ------------------------------------------------------------------------
  service:
    config-version: ${SERVICE_CONFIG_VERSION:}
    radius-meters: ${SERVICE_RADIUS_METERS:}
    demo-center:
      lat: ${SERVICE_DEMO_CENTER_LAT:}
      lng: ${SERVICE_DEMO_CENTER_LNG:}
    limits:
      memory-content-max-code-points: ${SERVICE_LIMIT_MEMORY_CONTENT_MAX_CODE_POINTS:}
      preference-description-max-code-points: ${SERVICE_LIMIT_PREFERENCE_DESCRIPTION_MAX_CODE_POINTS:}
      report-details-max-code-points: ${SERVICE_LIMIT_REPORT_DETAILS_MAX_CODE_POINTS:}
      image-max-bytes: ${SERVICE_LIMIT_IMAGE_MAX_BYTES:}
      image-max-width: ${SERVICE_LIMIT_IMAGE_MAX_WIDTH:}
      image-max-height: ${SERVICE_LIMIT_IMAGE_MAX_HEIGHT:}
      image-max-pixels: ${SERVICE_LIMIT_IMAGE_MAX_PIXELS:}
      image-upload-ttl-seconds: ${SERVICE_LIMIT_IMAGE_UPLOAD_TTL_SECONDS:}
      analysis-ttl-seconds: ${SERVICE_LIMIT_ANALYSIS_TTL_SECONDS:}
      daily-direct-memory-limit: ${SERVICE_LIMIT_DAILY_DIRECT_MEMORY_LIMIT:}
      default-page-limit: ${SERVICE_LIMIT_DEFAULT_PAGE_LIMIT:}
      max-page-limit: ${SERVICE_LIMIT_MAX_PAGE_LIMIT:}
      max-map-page-limit: ${SERVICE_LIMIT_MAX_MAP_PAGE_LIMIT:}
    auth:
      access-token-ttl-seconds: ${SERVICE_AUTH_ACCESS_TOKEN_TTL_SECONDS:}
      failed-login-limit: ${SERVICE_AUTH_FAILED_LOGIN_LIMIT:}
      login-lock-seconds: ${SERVICE_AUTH_LOGIN_LOCK_SECONDS:}

  # ------------------------------------------------------------------------
  # 서명값(analysisToken·커서) 키. 프로필별로 명시적으로 공급한다.
  # ------------------------------------------------------------------------
  signing:
    secret: ${SIGNING_SECRET:}

  # ------------------------------------------------------------------------
  # AI 호출 계약(C09). 공통 설정은 provider/model fallback을 제공하지 않는다.
  # local/ci 프로필만 합성 개발 설정을 제공하며, prod는 실제 구현과 설정이 필요하다.
  # ------------------------------------------------------------------------
  ai:
    provider: ${AI_PROVIDER:}
    timeout: ${AI_TIMEOUT:}
    analysis-model: ${AI_ANALYSIS_MODEL:}
    analysis-prompt-version: ${AI_ANALYSIS_PROMPT_VERSION:}
    moderation-model: ${AI_MODERATION_MODEL:}
    moderation-prompt-version: ${AI_MODERATION_PROMPT_VERSION:}
    # provider=http 일 때만 사용. 별도 AI FastAPI 서버 origin 과 공유 토큰(선택).
    # Claude 키는 여기 두지 않는다 — AI 서버 .env 에만 있고 백엔드는 AI 서버만 호출한다.
    base-url: ${AI_BASE_URL:}
    service-token: ${AI_SERVICE_TOKEN:}

  # ------------------------------------------------------------------------
  # 기획 "AI 어떻게 활용할까요?" §5~§7 매칭·집계 수치. 비우면 기획 문서의 값이 기본이다.
  # ------------------------------------------------------------------------
  matching:
    radius-meters: ${MATCH_RADIUS_METERS:}                     # 1000
    fallback-radius-meters: ${MATCH_FALLBACK_RADIUS_METERS:}   # 3000 (기본 반경 안 장소 3개 미만이면)
    min-places-for-primary-radius: ${MATCH_MIN_PLACES:}        # 3
    notify-threshold: ${MATCH_NOTIFY_THRESHOLD:}               # 0.85
    verify-threshold: ${MATCH_VERIFY_THRESHOLD:}               # 0.65
    similarity-weight: ${MATCH_SIMILARITY_WEIGHT:}             # 0.85
    distance-weight: ${MATCH_DISTANCE_WEIGHT:}                 # 0.15
    place-vibe-smoothing: ${MATCH_PLACE_VIBE_SMOOTHING:}       # 2  (P = 평균 × n/(n+2))
    merge-distance-meters: ${MATCH_MERGE_DISTANCE_METERS:}     # 20 (미등록 장소 병합 반경)
    category-confidence-threshold: ${MATCH_CATEGORY_CONFIDENCE_THRESHOLD:}   # 0.6
    reviews-for-verify: ${MATCH_REVIEWS_FOR_VERIFY:}           # 5

  # LETTER 안전 검사(A07) DB 상태 기반 재시도 주기.
  moderation:
    retry-delay: ${MODERATION_RETRY_DELAY:PT5M}
    retry-initial-delay: ${MODERATION_RETRY_INITIAL_DELAY:PT1M}

  # CORS는 명시적 origin allowlist만 허용한다. 빈 값은 교차 출처 요청을 허용하지 않는다.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # ------------------------------------------------------------------------
  # JWT 설정. 만료 시간의 유일 원천은 app.service.auth.access-token-ttl-seconds 이다.
  # secret은 프로필별로 명시적으로 공급한다.
  # ------------------------------------------------------------------------
  jwt:
    secret: ${JWT_SECRET:}

# API 문서 (springdoc-openapi). 경로를 명시해 팀원이 쉽게 찾도록 둔다.
#   Swagger UI : /swagger-ui.html   |   OpenAPI JSON : /v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 태그/메서드 알파벳 정렬(선택)
    operations-sorter: alpha
    tags-sorter: alpha

# Actuator: 헬스체크 최소 노출
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

logging:
  level:
    root: INFO
