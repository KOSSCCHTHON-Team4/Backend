# ============================================================================
# application-ci.yml  (GitHub Actions — DB 에 연결하지 않는다)
#   정책: DB 데이터/스키마를 CI(원격)로 올리지 않는다. CI 는 컴파일 + DB 비연결
#   단위테스트(gradlew test)만 수행한다. 앱 전체 부팅(bootRun)은 하지 않는다.
#   (앱 부팅은 실제 DB 가 있는 local 프로필에서 개발자가 수행)
#
#   DataSource/JPA/Flyway 자동구성을 끄지만, JPA starter 가 클래스패스에 있는 한
#   앱 "부팅"까지 완전 무DB 로 만들긴 어렵다. 그래서 이 프로필은 부팅용이 아니라
#   컨텍스트를 띄우지 않는 단위테스트 전용이다.
# ============================================================================
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
  flyway:
    enabled: false

app:
  # CI 단위 테스트용 합성 설정. prod 프로필에는 적용되지 않는다.
  signing:
    secret: ${SIGNING_SECRET:local-dev-only-change-me-emotionmap-signing-secret-key-0987654321}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-emotionmap-jwt-secret-key-1234567890}
  ai:
    provider: ${AI_PROVIDER:mock}
    timeout: ${AI_TIMEOUT:PT8S}
    analysis-model: ${AI_ANALYSIS_MODEL:mock-analysis}
    analysis-prompt-version: ${AI_ANALYSIS_PROMPT_VERSION:mock-v1}
    moderation-model: ${AI_MODERATION_MODEL:mock-moderation}
    moderation-prompt-version: ${AI_MODERATION_PROMPT_VERSION:mock-v1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: WARN
    team4.emotionmap: INFO
