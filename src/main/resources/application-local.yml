# ============================================================================
# application-local.yml  (로컬 개발용 — 각자 로컬 PostgreSQL 17 + pgvector)
#   Docker 를 사용하지 않는다. 각자 자기 PC 에 PostgreSQL 17 을 직접 설치하고
#   pgvector 확장을 활성화한 뒤 아래 값에 맞춰 DB/계정을 만든다.
#   (설치 방법은 README / ARCHITECTURE.md 참고)
#
#   접속 정보가 각자 다르면 이 파일을 고치는 대신 환경변수로 오버라이드하는 것을
#   권장한다:  DB_URL / DB_USERNAME / DB_PASSWORD
# ============================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/emotionmap}
    username: ${DB_USERNAME:emotionmap}
    password: ${DB_PASSWORD:emotionmap}
    driver-class-name: org.postgresql.Driver

  # local 프로필에서만 개발용 더미데이터 시드(db/seed)를 함께 로드한다.
  #   * 공통 application.yml 은 db/migration 만 로드한다(운영 스키마).
  #   * prod/ci 는 이 오버라이드가 없으므로 db/seed 가 절대 실행되지 않는다.
  #   * db/seed 의 R__seed_dev_data.sql 은 SYNTHETIC/TEAM_TEST 합성 데이터만 넣는다.
  flyway:
    locations: classpath:db/migration,classpath:db/seed

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    team4.emotionmap: DEBUG

# ----------------------------------------------------------------------------
# A03 서비스 설정 — API_SPEC 8.2 의 MOCK 예시값 (D03 미확정. 운영값으로 확정한 것이 아니다).
# 로컬 개발·FE 연동 편의를 위해서만 둔다. prod 는 환경변수 주입 없이는 503 이다.
# ----------------------------------------------------------------------------
app:
  service:
    config-version: ${SERVICE_CONFIG_VERSION:mock-config-v1}
    radius-meters: ${SERVICE_RADIUS_METERS:1000}
    demo-center:
      lat: ${SERVICE_DEMO_CENTER_LAT:37.6109}
      lng: ${SERVICE_DEMO_CENTER_LNG:126.9977}
    limits:
      memory-content-max-code-points: ${SERVICE_LIMIT_MEMORY_CONTENT_MAX_CODE_POINTS:3000}
      preference-description-max-code-points: ${SERVICE_LIMIT_PREFERENCE_DESCRIPTION_MAX_CODE_POINTS:1000}
      report-details-max-code-points: ${SERVICE_LIMIT_REPORT_DETAILS_MAX_CODE_POINTS:1000}
      image-max-bytes: ${SERVICE_LIMIT_IMAGE_MAX_BYTES:5242880}
      image-max-width: ${SERVICE_LIMIT_IMAGE_MAX_WIDTH:6000}
      image-max-height: ${SERVICE_LIMIT_IMAGE_MAX_HEIGHT:6000}
      image-max-pixels: ${SERVICE_LIMIT_IMAGE_MAX_PIXELS:20000000}
      image-upload-ttl-seconds: ${SERVICE_LIMIT_IMAGE_UPLOAD_TTL_SECONDS:1800}
      analysis-ttl-seconds: ${SERVICE_LIMIT_ANALYSIS_TTL_SECONDS:900}
      daily-direct-memory-limit: ${SERVICE_LIMIT_DAILY_DIRECT_MEMORY_LIMIT:20}
      default-page-limit: ${SERVICE_LIMIT_DEFAULT_PAGE_LIMIT:20}
      max-page-limit: ${SERVICE_LIMIT_MAX_PAGE_LIMIT:50}
      max-map-page-limit: ${SERVICE_LIMIT_MAX_MAP_PAGE_LIMIT:200}
    auth:
      access-token-ttl-seconds: ${SERVICE_AUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
      failed-login-limit: ${SERVICE_AUTH_FAILED_LOGIN_LIMIT:5}
      login-lock-seconds: ${SERVICE_AUTH_LOGIN_LOCK_SECONDS:60}
