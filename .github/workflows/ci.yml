# ============================================================================
# CI: PR 과 main push 마다 컴파일 + DB 비연결 단위테스트 실행
#   이 레포는 백엔드 전용 레포다(프로젝트 루트 = 레포 루트).
#
#   정책: DB 데이터/스키마를 원격(CI)에 올리지 않는다. DB 서비스 컨테이너를 띄우지
#         않으며, DB 가 필요한 통합테스트는 각자 로컬 PostgreSQL 에서만 수행한다.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run DB-less unit tests
        run: ./gradlew test --console=plain
        env:
          SPRING_PROFILES_ACTIVE: ci

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
