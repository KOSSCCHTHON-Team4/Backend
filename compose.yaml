name: "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be set}"

services:
  db:
    image: "pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f"
    command: ["postgres", "-c", "listen_addresses=*"]
    stop_grace_period: "${DB_STOP_GRACE_PERIOD:?DB_STOP_GRACE_PERIOD must be set}"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      DB_NAME: "${DB_NAME:?DB_NAME must be set}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME must be set}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    ports:
      - "127.0.0.1:${DB_HOST_PORT:?DB_HOST_PORT must be set}:5432"
    volumes:
      - "db_data:/var/lib/postgresql/data"
      - type: bind
        source: ./deploy/postgres/10-init-app-db.sh
        target: /docker-entrypoint-initdb.d/10-init-app-db.sh
        read_only: true
    networks:
      db_network:
        ipv4_address: "${DB_IPV4_ADDRESS:?DB_IPV4_ADDRESS must be set}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${DB_PASSWORD}" psql -X -w -h 127.0.0.1 -p 5432
          -U "$${DB_USERNAME}" -d "$${DB_NAME}" -v ON_ERROR_STOP=1 -Atqc
          "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector') AND has_schema_privilege(current_user, 'public', 'USAGE') AND has_schema_privilege(current_user, 'public', 'CREATE') AND NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls THEN '1' ELSE '0' END FROM pg_roles WHERE rolname = current_user;"
          | grep -Fxq 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  api:
    image: "${API_IMAGE:?API_IMAGE must be set}"
    network_mode: host
    user: "10001:10001"
    read_only: true
    tmpfs:
      - "/tmp:rw,mode=1777"
    volumes:
      - "image_data:/var/lib/emotionmap/uploads"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    stop_grace_period: "${API_STOP_GRACE_PERIOD:?API_STOP_GRACE_PERIOD must be set}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      DB_URL: "jdbc:postgresql://127.0.0.1:${DB_HOST_PORT:?DB_HOST_PORT must be set}/${DB_NAME:?DB_NAME must be set}?currentSchema=public"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME must be set}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      DB_SCHEMA: "public"
      APP_UPLOAD_DIR: "/var/lib/emotionmap/uploads"
      AI_PROVIDER: "http"
      AI_BASE_URL: "http://127.0.0.1:8001"
      SERVER_ADDRESS: "127.0.0.1"
      SERVER_PORT: "${API_PORT:-8080}"
      SERVER_SHUTDOWN: "graceful"
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "${API_SHUTDOWN_TIMEOUT:?API_SHUTDOWN_TIMEOUT must be set}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_FLYWAY_CLEAN_DISABLED: "true"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      SIGNING_SECRET: "${SIGNING_SECRET:?SIGNING_SECRET must be set}"
      PASSWORD_BCRYPT_STRENGTH: "${PASSWORD_BCRYPT_STRENGTH:?PASSWORD_BCRYPT_STRENGTH must be set}"
      LOGIN_FAILED_ATTEMPT_WINDOW_SECONDS: "${LOGIN_FAILED_ATTEMPT_WINDOW_SECONDS:?LOGIN_FAILED_ATTEMPT_WINDOW_SECONDS must be set}"
      SERVICE_CONFIG_VERSION: "${SERVICE_CONFIG_VERSION:?SERVICE_CONFIG_VERSION must be set}"
      SERVICE_RADIUS_METERS: "${SERVICE_RADIUS_METERS:?SERVICE_RADIUS_METERS must be set}"
      SERVICE_DEMO_CENTER_LAT: "${SERVICE_DEMO_CENTER_LAT:?SERVICE_DEMO_CENTER_LAT must be set}"
      SERVICE_DEMO_CENTER_LNG: "${SERVICE_DEMO_CENTER_LNG:?SERVICE_DEMO_CENTER_LNG must be set}"
      SERVICE_LIMIT_MEMORY_CONTENT_MAX_CODE_POINTS: "${SERVICE_LIMIT_MEMORY_CONTENT_MAX_CODE_POINTS:?SERVICE_LIMIT_MEMORY_CONTENT_MAX_CODE_POINTS must be set}"
      SERVICE_LIMIT_PREFERENCE_DESCRIPTION_MAX_CODE_POINTS: "${SERVICE_LIMIT_PREFERENCE_DESCRIPTION_MAX_CODE_POINTS:?SERVICE_LIMIT_PREFERENCE_DESCRIPTION_MAX_CODE_POINTS must be set}"
      SERVICE_LIMIT_REPORT_DETAILS_MAX_CODE_POINTS: "${SERVICE_LIMIT_REPORT_DETAILS_MAX_CODE_POINTS:?SERVICE_LIMIT_REPORT_DETAILS_MAX_CODE_POINTS must be set}"
      SERVICE_LIMIT_IMAGE_MAX_BYTES: "${SERVICE_LIMIT_IMAGE_MAX_BYTES:?SERVICE_LIMIT_IMAGE_MAX_BYTES must be set}"
      SERVICE_LIMIT_IMAGE_MAX_WIDTH: "${SERVICE_LIMIT_IMAGE_MAX_WIDTH:?SERVICE_LIMIT_IMAGE_MAX_WIDTH must be set}"
      SERVICE_LIMIT_IMAGE_MAX_HEIGHT: "${SERVICE_LIMIT_IMAGE_MAX_HEIGHT:?SERVICE_LIMIT_IMAGE_MAX_HEIGHT must be set}"
      SERVICE_LIMIT_IMAGE_MAX_PIXELS: "${SERVICE_LIMIT_IMAGE_MAX_PIXELS:?SERVICE_LIMIT_IMAGE_MAX_PIXELS must be set}"
      SERVICE_LIMIT_IMAGE_UPLOAD_TTL_SECONDS: "${SERVICE_LIMIT_IMAGE_UPLOAD_TTL_SECONDS:?SERVICE_LIMIT_IMAGE_UPLOAD_TTL_SECONDS must be set}"
      SERVICE_LIMIT_ANALYSIS_TTL_SECONDS: "${SERVICE_LIMIT_ANALYSIS_TTL_SECONDS:?SERVICE_LIMIT_ANALYSIS_TTL_SECONDS must be set}"
      SERVICE_LIMIT_DAILY_DIRECT_MEMORY_LIMIT: "${SERVICE_LIMIT_DAILY_DIRECT_MEMORY_LIMIT:?SERVICE_LIMIT_DAILY_DIRECT_MEMORY_LIMIT must be set}"
      SERVICE_LIMIT_DEFAULT_PAGE_LIMIT: "${SERVICE_LIMIT_DEFAULT_PAGE_LIMIT:?SERVICE_LIMIT_DEFAULT_PAGE_LIMIT must be set}"
      SERVICE_LIMIT_MAX_PAGE_LIMIT: "${SERVICE_LIMIT_MAX_PAGE_LIMIT:?SERVICE_LIMIT_MAX_PAGE_LIMIT must be set}"
      SERVICE_LIMIT_MAX_MAP_PAGE_LIMIT: "${SERVICE_LIMIT_MAX_MAP_PAGE_LIMIT:?SERVICE_LIMIT_MAX_MAP_PAGE_LIMIT must be set}"
      CURSOR_TTL: "${CURSOR_TTL:?CURSOR_TTL must be set}"
      SERVICE_AUTH_ACCESS_TOKEN_TTL_SECONDS: "${SERVICE_AUTH_ACCESS_TOKEN_TTL_SECONDS:?SERVICE_AUTH_ACCESS_TOKEN_TTL_SECONDS must be set}"
      SERVICE_AUTH_FAILED_LOGIN_LIMIT: "${SERVICE_AUTH_FAILED_LOGIN_LIMIT:?SERVICE_AUTH_FAILED_LOGIN_LIMIT must be set}"
      SERVICE_AUTH_LOGIN_LOCK_SECONDS: "${SERVICE_AUTH_LOGIN_LOCK_SECONDS:?SERVICE_AUTH_LOGIN_LOCK_SECONDS must be set}"
      APP_STORAGE_MULTIPART_REQUEST_OVERHEAD_BYTES: "${APP_STORAGE_MULTIPART_REQUEST_OVERHEAD_BYTES:?APP_STORAGE_MULTIPART_REQUEST_OVERHEAD_BYTES must be set}"
      REQUEST_COORDINATION_LEASE_DURATION: "${REQUEST_COORDINATION_LEASE_DURATION:?REQUEST_COORDINATION_LEASE_DURATION must be set}"
      IMAGE_CLEANUP_INTERVAL: "${IMAGE_CLEANUP_INTERVAL:?IMAGE_CLEANUP_INTERVAL must be set}"
      IMAGE_CLEANUP_BATCH_SIZE: "${IMAGE_CLEANUP_BATCH_SIZE:?IMAGE_CLEANUP_BATCH_SIZE must be set}"
      AI_TIMEOUT: "${AI_TIMEOUT:?AI_TIMEOUT must be set}"
      AI_ANALYSIS_MODEL: "${AI_ANALYSIS_MODEL:?AI_ANALYSIS_MODEL must be set}"
      AI_ANALYSIS_PROMPT_VERSION: "${AI_ANALYSIS_PROMPT_VERSION:?AI_ANALYSIS_PROMPT_VERSION must be set}"
      AI_MODERATION_MODEL: "${AI_MODERATION_MODEL:?AI_MODERATION_MODEL must be set}"
      AI_MODERATION_PROMPT_VERSION: "${AI_MODERATION_PROMPT_VERSION:?AI_MODERATION_PROMPT_VERSION must be set}"
      AI_SERVICE_TOKEN: "${AI_SERVICE_TOKEN:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      MATCH_RADIUS_METERS: "${MATCH_RADIUS_METERS:-}"
      MATCH_FALLBACK_RADIUS_METERS: "${MATCH_FALLBACK_RADIUS_METERS:-}"
      MATCH_MIN_PLACES: "${MATCH_MIN_PLACES:-}"
      MATCH_NOTIFY_THRESHOLD: "${MATCH_NOTIFY_THRESHOLD:-}"
      MATCH_VERIFY_THRESHOLD: "${MATCH_VERIFY_THRESHOLD:-}"
      MATCH_SIMILARITY_WEIGHT: "${MATCH_SIMILARITY_WEIGHT:-}"
      MATCH_DISTANCE_WEIGHT: "${MATCH_DISTANCE_WEIGHT:-}"
      MATCH_PLACE_VIBE_SMOOTHING: "${MATCH_PLACE_VIBE_SMOOTHING:-}"
      MATCH_MERGE_DISTANCE_METERS: "${MATCH_MERGE_DISTANCE_METERS:-}"
      MATCH_CATEGORY_CONFIDENCE_THRESHOLD: "${MATCH_CATEGORY_CONFIDENCE_THRESHOLD:-}"
      MATCH_REVIEWS_FOR_VERIFY: "${MATCH_REVIEWS_FOR_VERIFY:-}"
      MODERATION_RETRY_DELAY: "${MODERATION_RETRY_DELAY:-PT5M}"
      MODERATION_RETRY_INITIAL_DELAY: "${MODERATION_RETRY_INITIAL_DELAY:-PT1M}"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:$${SERVER_PORT}/actuator/health"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  db_network:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: "${DB_NETWORK_SUBNET:?DB_NETWORK_SUBNET must be set}"

volumes:
  db_data:
  image_data:
