                    message: 조회 조건이 변경되었습니다. 첫 페이지부터 다시 조회해 주세요
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                INVALID_REQUEST:
                  value:
                    code: INVALID_REQUEST
                    message: 요청 형식이 올바르지 않습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '404':
          description: RESOURCE_NOT_FOUND
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                RESOURCE_NOT_FOUND:
                  value:
                    code: RESOURCE_NOT_FOUND
                    message: 요청한 항목을 찾을 수 없습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        default:
          description: 예상하지 못한 오류도 동일 ApiError 형식. 실제 성공/실패는 HTTP 상태를 따른다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: id
        in: path
        required: true
        description: 내부Place ID
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        description: opaque cursor. 첫 페이지에서는 생략. 필터가 바뀌면 폐기한다.
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        description: 생략 시 /v1/config.limits.defaultPageLimit. 일반 목록 상한 maxPageLimit, 지도 maxMapPageLimit.
        schema:
          type: integer
          minimum: 1
  /v1/reports:
    post:
      operationId: createReport
      summary: 열람 가능한 경험 신고 접수
      tags:
      - Reports
      description: 사유 코드는 운영 초안이다. reason은 기존 text 열에 저장하고 details는 별도 nullable 열을 제안한다. 같은 사용자·원문의 새로운 신고는 허용하되
        동일 요청 키의 재시도는 기존 접수증을 반환한다. OPEN은 접수 상태이지 숨김 완료가 아니다. 운영자 도구는 별도 계약이다. 완료된 요청을 재확인할 때 원문이 이후 숨겨졌어도 본인 접수증만
        반환할 수 있다.
      x-contract-status: PROPOSED
      x-onboarding-required: true
      responses:
        '201':
          description: 성공 (최초 생성)
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
              examples:
                created:
                  value:
                    reportId: 60000000-0000-4000-8000-000000000001
                    memoryId: 30000000-0000-4000-8000-000000000001
                    reason: PERSONAL_INFORMATION
                    status: OPEN
                    createdAt: '2026-09-20T10:07:00+09:00'
        '200':
          description: 같은 Idempotency-Key의 완료된 요청 재확인. 새 객체를 생성하지 않음
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
              examples:
                created:
                  value:
                    reportId: 60000000-0000-4000-8000-000000000001
                    memoryId: 30000000-0000-4000-8000-000000000001
                    reason: PERSONAL_INFORMATION
                    status: OPEN
                    createdAt: '2026-09-20T10:07:00+09:00'
        '401':
          description: AUTH_REQUIRED, TOKEN_EXPIRED, INVALID_TOKEN
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer 인증 실패 응답 challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                AUTH_REQUIRED:
                  value:
                    code: AUTH_REQUIRED
                    message: 로그인이 필요합니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                TOKEN_EXPIRED:
                  value:
                    code: TOKEN_EXPIRED
                    message: 로그인이 만료되었습니다. 다시 로그인해 주세요
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: 인증 정보를 확인할 수 없습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '403':
          description: INVITATION_REQUIRED, ACCOUNT_SUSPENDED, ACCOUNT_CLOSED, ONBOARDING_REQUIRED
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INVITATION_REQUIRED:
                  value:
                    code: INVITATION_REQUIRED
                    message: 초대된 계정만 사용할 수 있습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                ACCOUNT_SUSPENDED:
                  value:
                    code: ACCOUNT_SUSPENDED
                    message: 이용이 제한된 계정입니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                ACCOUNT_CLOSED:
                  value:
                    code: ACCOUNT_CLOSED
                    message: 종료된 계정입니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                ONBOARDING_REQUIRED:
                  value:
                    code: ONBOARDING_REQUIRED
                    message: 초기 설정을 완료해 주세요
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '503':
          description: SERVICE_UNAVAILABLE
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
            Retry-After:
              schema:
                type: string
                pattern: ^[0-9]+$
              description: 재시도 가능한 경우에만 남은 초. body retryAfterSeconds와 일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                SERVICE_UNAVAILABLE:
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: 일시적으로 요청을 처리할 수 없습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '400':
          description: INVALID_JSON, DUPLICATE_JSON_KEY, INVALID_REQUEST, IDEMPOTENCY_KEY_REQUIRED
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INVALID_JSON:
                  value:
                    code: INVALID_JSON
                    message: JSON 형식이 올바르지 않습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                DUPLICATE_JSON_KEY:
                  value:
                    code: DUPLICATE_JSON_KEY
                    message: 중복된 JSON 키가 있습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                INVALID_REQUEST:
                  value:
                    code: INVALID_REQUEST
                    message: 요청 형식이 올바르지 않습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                IDEMPOTENCY_KEY_REQUIRED:
                  value:
                    code: IDEMPOTENCY_KEY_REQUIRED
                    message: 재시도 식별자가 필요합니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '422':
          description: VALIDATION_ERROR
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                VALIDATION_ERROR:
                  value:
                    code: VALIDATION_ERROR
                    message: 입력값을 확인해 주세요
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '409':
          description: IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
            Retry-After:
              schema:
                type: string
                pattern: ^[0-9]+$
              description: 재시도 가능한 경우에만 남은 초. body retryAfterSeconds와 일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                IDEMPOTENCY_KEY_REUSED:
                  value:
                    code: IDEMPOTENCY_KEY_REUSED
                    message: 같은 재시도 식별자에 다른 요청이 사용되었습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                REQUEST_IN_PROGRESS:
                  value:
                    code: REQUEST_IN_PROGRESS
                    message: 동일한 요청을 처리하고 있습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '404':
          description: RESOURCE_NOT_FOUND
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                RESOURCE_NOT_FOUND:
                  value:
                    code: RESOURCE_NOT_FOUND
                    message: 요청한 항목을 찾을 수 없습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '410':
          description: MEMORY_UNAVAILABLE
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                MEMORY_UNAVAILABLE:
                  value:
                    code: MEMORY_UNAVAILABLE
                    message: 더 이상 열람할 수 없는 경험입니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '429':
          description: RATE_LIMITED
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
            Retry-After:
              schema:
                type: string
                pattern: ^[0-9]+$
              description: 재시도 가능한 경우에만 남은 초. body retryAfterSeconds와 일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                RATE_LIMITED:
                  value:
                    code: RATE_LIMITED
                    message: 요청이 너무 많습니다. 잠시 후 다시 시도해 주세요
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        default:
          description: 예상하지 못한 오류도 동일 ApiError 형식. 실제 성공/실패는 HTTP 상태를 따른다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 직접 생성 재시도에 유지하는 UUID. 사용자+HTTP 메서드+경로에 귀속. 같은 키의 다른 payload는409. 좋아요에는 사용하지 않음.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
            examples:
              report:
                value:
                  memoryId: 30000000-0000-4000-8000-000000000001
                  reason: PERSONAL_INFORMATION
                  details: 본문에 타인의 연락처가 포함되어 있습니다.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 서비스 access token. JWT인지 여부는 클라이언트가 해석하지 않는다.
  schemas:
    AxisCode:
      type: string
      enum:
      - CROWD_LEVEL
      - SPATIAL_FEEL
      - COMPANY_FIT
      - STAY_STYLE
    PlaceCategoryCode:
      type: string
      enum:
      - CAFE
      - RESTAURANT
      - BAR
      - PARK_WALK
      - CULTURE
      - STUDY_WORK
      - SHOPPING
      - OTHER
    Atmospheres:
      type: object
      properties:
        CROWD_LEVEL:
          type: integer
          enum:
          - -1
          - 1
        SPATIAL_FEEL:
          type: integer
          enum:
          - -1
          - 1
        COMPANY_FIT:
          type: integer
          enum:
          - -1
          - 1
        STAY_STYLE:
          type: integer
          enum:
          - -1
          - 1
      required:
      - CROWD_LEVEL
      - SPATIAL_FEEL
      - COMPANY_FIT
      - STAY_STYLE
      additionalProperties: false
      description: 최종 설정/경험의 필수 4축. JSON 중복 키와 소수 리터럴 검사는 HTTP 파서에서 별도 수행한다.
    AnalyzedAtmospheres:
      type: object
      properties:
        CROWD_LEVEL:
          anyOf:
          - type: integer
            enum:
            - -1
            - 1
          - type: 'null'
        SPATIAL_FEEL:
          anyOf:
          - type: integer
            enum:
            - -1
            - 1
          - type: 'null'
        COMPANY_FIT:
          anyOf:
          - type: integer
            enum:
            - -1
            - 1
          - type: 'null'
        STAY_STYLE:
          anyOf:
          - type: integer
            enum:
            - -1
            - 1
          - type: 'null'
      required:
      - CROWD_LEVEL
      - SPATIAL_FEEL
      - COMPANY_FIT
      - STAY_STYLE
      additionalProperties: false
      description: AI 분석 중에만 null 허용. 최종 저장에는 null 불가.
    CategoryCodes:
      type: array
      items:
        $ref: '#/components/schemas/PlaceCategoryCode'
      maxItems: 3
      uniqueItems: true
    Coordinates:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
      required:
      - lat
      - lng
      additionalProperties: false
    PlaceSnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        label:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - lat
      - lng
      - label
      additionalProperties: false
    PageInfo:
      type: object
      properties:
        nextCursor:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        hasMore:
          type: boolean
      required:
      - nextCursor
      - hasMore
      additionalProperties: false
      description: hasMore=false iff nextCursor=null. 커서는 사용자/경로/필터/정렬 범위에 귀속된다.
    FieldError:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string
          enum:
          - REQUIRED
          - INVALID_VALUE
          - DUPLICATE
          - OUT_OF_RANGE
          - UNKNOWN_FIELD
          - TOO_LONG
          - IMMUTABLE
      required:
      - field
      - reason
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
      - INVALID_CREDENTIALS
      - EMAIL_ALREADY_EXISTS
      - TOO_MANY_ATTEMPTS
      - AUTH_REQUIRED
      - TOKEN_EXPIRED
      - INVALID_TOKEN
      - INVITATION_REQUIRED
      - ACCOUNT_SUSPENDED
      - ACCOUNT_CLOSED
      - ONBOARDING_REQUIRED
      - INVALID_JSON
      - DUPLICATE_JSON_KEY
      - INVALID_REQUEST
      - VALIDATION_ERROR
      - INVALID_ATMOSPHERES
      - INVALID_CATEGORIES
      - IMMUTABLE_FIELD
      - ONBOARDING_ALREADY_COMPLETED
      - PREFERENCE_VERSION_CONFLICT
      - RESOURCE_NOT_FOUND
      - MEMORY_UNAVAILABLE
      - IMAGE_NOT_FOUND
      - IMAGE_UPLOAD_EXPIRED
      - IMAGE_ALREADY_ATTACHED
      - IMAGE_TOO_LARGE
      - UNSUPPORTED_IMAGE_TYPE
      - INVALID_IMAGE
      - IMAGE_DIMENSIONS_EXCEEDED
      - IMAGE_STORAGE_UNAVAILABLE
      - IMAGE_FILE_UNAVAILABLE
      - ANALYSIS_TOKEN_INVALID
      - ANALYSIS_TOKEN_EXPIRED
      - ANALYSIS_CONTENT_MISMATCH
      - DAILY_WRITE_LIMIT_EXCEEDED
      - RATE_LIMITED
      - INVALID_CURSOR
      - CURSOR_CONTEXT_MISMATCH
      - INVALID_BBOX
      - PLACE_COORDINATE_MISMATCH
      - IDEMPOTENCY_KEY_REQUIRED
      - IDEMPOTENCY_KEY_REUSED
      - REQUEST_IN_PROGRESS
      - COPY_FAILED
      - CONFIGURATION_UNAVAILABLE
      - SERVICE_UNAVAILABLE
      - SERVER_ERROR
    ApiError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        retryAfterSeconds:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        requestId:
          type: string
          minLength: 1
      required:
      - code
      - message
      - retryAfterSeconds
      - fieldErrors
      - requestId
      additionalProperties: false
      description: code로 분기. retryAfterSeconds는 없으면 null이며 429 응답의 Retry-After 헤더와 동일하다. message는 사용자 표시용으로 SQL/경로/작성자
        정보 금지.
    LoginUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          minLength: 1
          description: 필수 로그인 이메일. 이메일·비밀번호 전용 계정이므로 null을 반환하지 않는다.
        hasOnboarded:
          type: boolean
      required:
      - id
      - email
      - hasOnboarded
      additionalProperties: false
      description: 인증에 성공한 자체 이메일·비밀번호 계정. 이메일 필수, 해시·비밀번호·잠금 내부 정보는 반환하지 않는다.
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: string
          format: date-time
        expiresInSeconds:
          type: integer
          minimum: 1
        refreshSupported:
          const: false
          type: boolean
        user:
          $ref: '#/components/schemas/LoginUser'
      required:
      - accessToken
      - tokenType
      - expiresAt
      - expiresInSeconds
      - refreshSupported
      - user
      additionalProperties: false
      description: 무갱신 토큰은 승인 전 MVP 제안. 실 토큰 TTL은 서버 설정이다. 토큰은 예시에 실제 값으로 포함하지 않는다.
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - email
      - password
      additionalProperties: false
      description: '확정: 이메일·비밀번호만 받는다. 두 필드 필수, 그 외 필드 금지. 비밀번호를 trim·소문자화·정규화하지 않고 서버에서 저장된 비밀번호 해시와 검증한다. 인증 방식은
        확정, 해시 구현·계정 공급·TTL은 별도 계약이다.'
      x-contract-status: AUTH_METHOD_CONFIRMED
    ServiceLimits:
      type: object
      properties:
        memoryContentMaxCodePoints:
          type: integer
          minimum: 1
        preferenceDescriptionMaxCodePoints:
          type: integer
          minimum: 1
        reportDetailsMaxCodePoints:
          type: integer
          minimum: 1
        imageMaxBytes:
          type: integer
          minimum: 1
        imageMaxWidth:
          type: integer
          minimum: 1
        imageMaxHeight:
          type: integer
          minimum: 1
        imageMaxPixels:
          type: integer
          minimum: 1
        imageUploadTtlSeconds:
          type: integer
          minimum: 1
        analysisTtlSeconds:
          type: integer
          minimum: 1
        dailyDirectMemoryLimit:
          type: integer
          minimum: 1
        defaultPageLimit:
          type: integer
          minimum: 1
        maxPageLimit:
          type: integer
          minimum: 1
        maxMapPageLimit:
          type: integer
          minimum: 1
      required:
      - memoryContentMaxCodePoints
      - preferenceDescriptionMaxCodePoints
      - reportDetailsMaxCodePoints
      - imageMaxBytes
      - imageMaxWidth
      - imageMaxHeight
      - imageMaxPixels
      - imageUploadTtlSeconds
      - analysisTtlSeconds
      - dailyDirectMemoryLimit
      - defaultPageLimit
      - maxPageLimit
      - maxMapPageLimit
      additionalProperties: false
      description: 실제 값은 팀 합의/서버 설정. 첨부 숫자는 MOCK 예시이며 확정 제품 제한값이 아니다.
    ServiceConfig:
      type: object
      properties:
        configVersion:
          type: string
        radiusMeters:
          type: integer
          minimum: 1
        demoCenter:
          $ref: '#/components/schemas/Coordinates'
        deliveryTimeZone:
          type: string
          enum:
          - Asia/Seoul
        deliveryLocalTime:
          type: string
          enum:
          - 09:00
        limits:
          $ref: '#/components/schemas/ServiceLimits'
        auth:
          type: object
          properties:
            mode:
              type: string
              const: EMAIL_PASSWORD
              description: 지원하는 유일한 로그인 방식. 최초 로그인 화면은 config 조회 없이 이메일/비밀번호 폼을 사용한다.
            refreshSupported:
              type: boolean
              const: false
            accessTokenTtlSeconds:
              type: integer
              minimum: 1
            failedLoginLimit:
              type: integer
              minimum: 1
            loginLockSeconds:
              type: integer
              minimum: 1
          required:
          - mode
          - refreshSupported
          - accessTokenTtlSeconds
          - failedLoginLimit
          - loginLockSeconds
          additionalProperties: false
      required:
      - configVersion
      - radiusMeters
      - demoCenter
      - deliveryTimeZone
      - deliveryLocalTime
      - limits
      - auth
      additionalProperties: false
      description: 반경·한도는 서버 설정이다. auth.mode는 EMAIL_PASSWORD로 확정. 토큰 TTL과 그 밖의 mock 수치는 실제 운영값의 확정이 아니다.
    AxisOption:
      type: object
      properties:
        value:
          type: integer
          enum:
          - -1
          - 1
        label:
          type: string
      required:
      - value
      - label
      additionalProperties: false
    AtmosphereAxis:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/AxisCode'
        order:
          type: integer
          minimum: 1
          maximum: 4
        options:
          type: array
          items:
            $ref: '#/components/schemas/AxisOption'
          minItems: 2
          maxItems: 2
      required:
      - code
      - order
      - options
      additionalProperties: false
    AtmosphereAxesResponse:
      type: object
      properties:
        version:
          type: integer
          const: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/AtmosphereAxis'
          minItems: 4
          maxItems: 4
      required:
      - version
      - items
      additionalProperties: false
    PlaceCategory:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/PlaceCategoryCode'
        label:
          type: string
        definition:
          type: string
        order:
          type: integer
          minimum: 1
          maximum: 8
      required:
      - code
      - label
      - definition
      - order
      additionalProperties: false
    PlaceCategoriesResponse:
      type: object
      properties:
        version:
          type: integer
          const: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaceCategory'
          minItems: 8
          maxItems: 8
      required:
      - version
      - items
      additionalProperties: false
    Mailbox:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        enabledAt:
          type: string
          format: date-time
      required:
      - lat
      - lng
      - enabledAt
      additionalProperties: false
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          minLength: 1
          description: 필수 로그인 이메일. 이메일·비밀번호 전용 계정이므로 null을 반환하지 않는다.
        hasOnboarded:
          type: boolean
        mailbox:
          anyOf:
          - $ref: '#/components/schemas/Mailbox'
          - type: 'null'
        atmospheres:
          anyOf:
          - $ref: '#/components/schemas/Atmospheres'
          - type: 'null'
        preferenceDescription:
          anyOf:
          - type: string
          - type: 'null'
        preferenceVersion:
          anyOf:
          - type: string
            pattern: ^[1-9][0-9]*$
          - type: 'null'
        preferenceEffectiveAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - email
      - hasOnboarded
      - mailbox
      - atmospheres
      - preferenceDescription
      - preferenceVersion
      - preferenceEffectiveAt
      additionalProperties: false
      description: 온보딩 전 mailbox/atmospheres/preferenceVersion/preferenceEffectiveAt는 null. revision bigint는 정밀도
        보존을 위해 10진 문자열로 노출한다.
    OnboardingRequest:
      type: object
      properties:
        mailboxLat:
          type: number
          minimum: -90
          maximum: 90
        mailboxLng:
          type: number
          minimum: -180
          maximum: 180
        atmospheres:
          $ref: '#/components/schemas/Atmospheres'
        preferenceDescription:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - mailboxLat
      - mailboxLng
      - atmospheres
      - preferenceDescription
      additionalProperties: false
    PreferencesRequest:
      type: object
      properties:
        atmospheres:
          $ref: '#/components/schemas/Atmospheres'
        preferenceDescription:
          anyOf:
          - type: string
          - type: 'null'
        expectedPreferenceVersion:
          type: string
          pattern: ^[1-9][0-9]*$
      required:
      - atmospheres
      - preferenceDescription
      - expectedPreferenceVersion
      additionalProperties: false
      description: 설정 하위자원의 전체 값을 제출하는 원자적 변경. expectedPreferenceVersion은 동시 수정 방지 제안. 위치/버전 적용 시각은 요청 불가.
    AnalyzeRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          pattern: \S
      required:
      - content
      additionalProperties: false
    AnalyzeResponse:
      type: object
      properties:
        atmospheres:
          $ref: '#/components/schemas/AnalyzedAtmospheres'
        categories:
          $ref: '#/components/schemas/CategoryCodes'
        categoryStatus:
          type: string
          enum:
          - CLASSIFIED
          - UNCLASSIFIED
          - FAILED
        atmosphereStatus:
          type: string
          enum:
          - SUCCEEDED
          - PARTIAL
          - FAILED
        analysisToken:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
            enum:
            - ATMOSPHERE_NEEDS_INPUT
            - CATEGORY_UNCLASSIFIED
            - ANALYSIS_FAILED
      required:
      - atmospheres
      - categories
      - categoryStatus
      - atmosphereStatus
      - analysisToken
      - expiresAt
      - warnings
      additionalProperties: false
      description: analysisToken은 서버 서명 확인값 제안. 본문 해시·사용자·AI 제안/실행상태·모델 버전·만료를 검증한다. 실패한 AI 호출도 수동 입력을 위한 200+FAILED로
        표현 가능. 최종 축 null은 불가.
    CreateMemoryRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - LETTER
          - PRIVATE
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        content:
          type: string
          minLength: 1
          pattern: \S
        imageId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        atmospheres:
          $ref: '#/components/schemas/Atmospheres'
        categoryCodes:
          $ref: '#/components/schemas/CategoryCodes'
        analysisToken:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        placeId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
      required:
      - type
      - lat
      - lng
      - content
      - imageId
      - atmospheres
      - categoryCodes
      additionalProperties: false
      description: analysisToken/placeId는 추가 제안. 토큰 없음은 명시적 수동 분류로 저장. 원본 ID/소유자/상태/likedAt/dataOrigin는 서버가 결정하므로
        요청 불가.
    ImageUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
      additionalProperties: false
      description: multipart/form-data의 file 단일 파트. 실제 바이트가 JPEG/PNG인지 서버가 확인한다.
    ImageUploadResponse:
      type: object
      properties:
        imageId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        mediaType:
          type: string
          enum:
          - image/jpeg
          - image/png
        sizeBytes:
          type: integer
          minimum: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
      required:
      - imageId
      - expiresAt
      - mediaType
      - sizeBytes
      - width
      - height
      additionalProperties: false
      description: 원본 파일명/저장경로/공개 URL 없음. 인증된 업로더만 만료 전 한 번 첨부 가능.
    DeliveryContext:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        serviceDate:
          type: string
          format: date
        deliveredAt:
          type: string
          format: date-time
        readAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        likedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - deliveryId
      - serviceDate
      - deliveredAt
      - readAt
      - likedAt
      additionalProperties: false
    OwnerState:
      type: object
      properties:
        moderationStatus:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REVIEW_REQUIRED
          - REJECTED
          - ERROR
          - NOT_REQUIRED
        availableAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        likeCount:
          type: integer
          minimum: 0
        analysis:
          type: object
          properties:
            atmosphereStatus:
              type: string
              enum:
              - SUCCEEDED
              - PARTIAL
              - FAILED
              - NOT_RUN
            categoryStatus:
              type: string
              enum:
              - SUCCEEDED
              - INSUFFICIENT
              - FAILED
              - NOT_RUN
          required:
          - atmosphereStatus
          - categoryStatus
          additionalProperties: false
      required:
      - moderationStatus
      - availableAt
      - likeCount
      - analysis
      additionalProperties: false
      description: 본인 작성/소유 경험만 포함. likeCount는 원문 수신 이력의 누적 liked_at 개수이며 PRIVATE에서는 0. 모델·제공자 raw 응답은 노출하지 않는다.
    MemoryDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - LETTER
          - PRIVATE
        originKind:
          type: string
          enum:
          - DIRECT
          - LETTER_COPY
        dataOrigin:
          type: string
          enum:
          - PARTICIPANT
          - TEAM_TEST
          - SYNTHETIC
        content:
          type: string
        imageUrl:
          anyOf:
          - type: string
            format: uri-reference
          - type: 'null'
        atmospheres:
          $ref: '#/components/schemas/Atmospheres'
        categories:
          $ref: '#/components/schemas/CategoryCodes'
        categoryStatus:
          type: string
          enum:
          - CLASSIFIED
          - UNCLASSIFIED
        place:
          $ref: '#/components/schemas/PlaceSnapshot'
        createdAt:
          type: string
          format: date-time
        viewerRole:
          type: string
          enum:
          - OWNER
          - RECIPIENT
        ownerState:
          anyOf:
          - $ref: '#/components/schemas/OwnerState'
          - type: 'null'
        delivery:
          anyOf:
          - $ref: '#/components/schemas/DeliveryContext'
          - type: 'null'
      required:
      - id
      - type
      - originKind
      - dataOrigin
      - content
      - imageUrl
      - atmospheres
      - categories
      - categoryStatus
      - place
      - createdAt
      - viewerRole
      - ownerState
      - delivery
      additionalProperties: false
      description: OWNER면 ownerState 존재·delivery=null. RECIPIENT면 ownerState=null·delivery 존재. 사용자 ID/작성자 닉네임은 없다.
        최종 categoryStatus는 현재 categories.length 기준, AI 실행 결과와 별개이다.
    AvailableLetter:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        memoryId:
          type: string
          format: uuid
        serviceDate:
          type: string
          format: date
        deliveredAt:
          type: string
          format: date-time
        readAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        likedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        availability:
          type: string
          enum:
          - AVAILABLE
        unavailableReason:
          type: 'null'
        content:
          type: string
        imageUrl:
          anyOf:
          - type: string
            format: uri-reference
          - type: 'null'
        atmospheres:
          $ref: '#/components/schemas/Atmospheres'
        categories:
          $ref: '#/components/schemas/CategoryCodes'
        categoryStatus:
          type: string
          enum:
          - CLASSIFIED
          - UNCLASSIFIED
        place:
          $ref: '#/components/schemas/PlaceSnapshot'
        createdAt:
          type: string
          format: date-time
        dataOrigin:
          type: string
          enum:
          - PARTICIPANT
          - TEAM_TEST
          - SYNTHETIC
      required:
      - deliveryId
      - memoryId
      - serviceDate
      - deliveredAt
      - readAt
      - likedAt
      - availability
      - unavailableReason
      - content
      - imageUrl
      - atmospheres
      - categories
      - categoryStatus
      - place
      - createdAt
      - dataOrigin
      additionalProperties: false
    UnavailableLetter:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        memoryId:
          type: string
          format: uuid
        serviceDate:
          type: string
          format: date
        deliveredAt:
          type: string
          format: date-time
        readAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        likedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        availability:
          type: string
          enum:
          - UNAVAILABLE
        unavailableReason:
          type: string
          enum:
          - DELETED
          - HIDDEN
        content:
          type: 'null'
        imageUrl:
          type: 'null'
        atmospheres:
          type: 'null'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PlaceCategoryCode'
          maxItems: 0
        categoryStatus:
          type: 'null'
        place:
          type: 'null'
        createdAt:
          type: 'null'
        dataOrigin:
          type: 'null'
      required:
      - deliveryId
      - memoryId
      - serviceDate
      - deliveredAt
      - readAt
      - likedAt
      - availability
      - unavailableReason
      - content
      - imageUrl
      - atmospheres
      - categories
      - categoryStatus
      - place
      - createdAt
      - dataOrigin
      additionalProperties: false
      description: 과거 수신 권한을 확인한 사용자에게만 tombstone. 본문/좌표/태그/사진은 반환하지 않는다. 일일 성공 슬롯을 취소하지 않는다.
    LetterSummary:
      oneOf:
      - $ref: '#/components/schemas/AvailableLetter'
      - $ref: '#/components/schemas/UnavailableLetter'
      discriminator:
        propertyName: availability
        mapping:
          AVAILABLE: '#/components/schemas/AvailableLetter'
          UNAVAILABLE: '#/components/schemas/UnavailableLetter'
    LetterPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LetterSummary'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - pageInfo
      additionalProperties: false
    MemoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemoryDetail'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - pageInfo
      additionalProperties: false
    TodayResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - PENDING
          - NO_CANDIDATE
          - DELIVERED
          - RETRYING
          - ERROR
        serviceDate:
          type: string
          format: date
        scheduledAt:
          type: string
          format: date-time
        nextScheduledAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
        pendingReason:
          anyOf:
          - type: string
            enum:
            - BEFORE_SCHEDULE
            - FIRST_DELIVERY_TOMORROW
            - SCHEDULE_DELAYED
            - PROCESSING
          - type: 'null'
        errorReason:
          anyOf:
          - type: string
            enum:
            - RETRYABLE_FAILURE
            - SELECTION_STATE_INCONSISTENT
            - PROCESSING_FAILURE
          - type: 'null'
        delivery:
          anyOf:
          - $ref: '#/components/schemas/LetterSummary'
          - type: 'null'
      required:
      - status
      - serviceDate
      - scheduledAt
      - nextScheduledAt
      - serverTime
      - pendingReason
      - errorReason
      - delivery
      additionalProperties: false
      description: DELIVERED이면 delivery 존재(삭제 tombstone 포함). 그 외 delivery=null. 과거 EXPIRED_ERROR를 오늘 오류로 복사하지 않는다.
        조회 자체 DB 장애는 HTTP503이며 NO_CANDIDATE로 변환하지 않는다.
    ReadResponse:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        readAt:
          type: string
          format: date-time
      required:
      - deliveryId
      - readAt
      additionalProperties: false
    CopiedResponse:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - COPIED
        likedAt:
          type: string
          format: date-time
        copiedMemoryId:
          type: string
          format: uuid
      required:
      - deliveryId
      - status
      - likedAt
      - copiedMemoryId
      additionalProperties: false
    AlreadyCopiedResponse:
      type: object
      properties:
        deliveryId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - ALREADY_COPIED
        likedAt:
          type: string
          format: date-time
        copiedMemoryId:
          type: 'null'
      required:
      - deliveryId
      - status
      - likedAt
      - copiedMemoryId
      additionalProperties: false
    LikeResponse:
      oneOf:
      - $ref: '#/components/schemas/CopiedResponse'
      - $ref: '#/components/schemas/AlreadyCopiedResponse'
      discriminator:
        propertyName: status
        mapping:
          COPIED: '#/components/schemas/CopiedResponse'
          ALREADY_COPIED: '#/components/schemas/AlreadyCopiedResponse'
      description: 둘 다 200. copiedMemoryId는 새 사본 생성 최초 응답에서만 임시 반환. 원문/배달/응답 캐시/로그에 원문-사본 연결을 저장하지 않는다. 재요청은 id=null로
        보관함 목록 이동.
    PlacePin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        label:
          anyOf:
          - type: string
          - type: 'null'
        memoryCount:
          type: integer
          minimum: 1
      required:
      - id
      - lat
      - lng
      - label
      - memoryCount
      additionalProperties: false
    PlacePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlacePin'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - pageInfo
      additionalProperties: false
      description: 현재 사용자에게 보이는 경험이 1개 이상인 내부 핀만 반환. 전체 공간/미수신 글의 개수를 반환하지 않는다.
    ReportReason:
      type: string
      enum:
      - SPAM
      - ABUSE
      - SEXUAL_CONTENT
      - VIOLENCE_OR_DANGEROUS_CONTENT
      - PERSONAL_INFORMATION
