openapi: 3.1.0
info:
  title: 감정지도 MVP API 계약 초안
  version: 0.2.0-draft
  description: '기준: MVP 1.4-final + ERD 1.0 + FE v2 + 사용자 이메일·비밀번호 전용 로그인 확정. 로그인 요청은 email/password 하나만 지원한다. 나머지
    신규 DTO·저장구조·토큰 TTL·수치 한도는 검토용 계약 초안이다. 예시는 mock이며 서비스 실데이터/설정이 아니다. 참여자용 22개 경로에 /v1 접두어를 적용한다.'
servers:
- url: /
  description: 배포 origin을 설정. paths에 /v1이 포함되어 있으므로 서버 URL에 중복 추가하지 않음
tags:
- name: Auth
- name: Config
- name: Users
- name: Memories
- name: Images
- name: Letters
- name: Bookmarks
- name: Places
- name: Reports
security:
- bearerAuth: []
paths:
  /v1/auth/login:
    post:
      operationId: login
      summary: 로그인 및 초기 설정 여부
      tags:
      - Auth
      description: 이메일·비밀번호로만 로그인한다. email과 password 두 필드를 필수로 받으며 그 외 필드는 INVALID_REQUEST로 거절한다. 비밀번호 해시 검증 뒤 초대·계정
        상태를 확인하고 서버 access token을 발급한다. 로그인 시 새 계정을 자동 생성하지 않는다. 5회 실패·60초 서버 제한은 기존 FE 계약 제안이며 관찰 구간·초기화·저장 방식은
        합의 대상이다.
      x-contract-status: AUTH_METHOD_CONFIRMED_OTHER_DETAILS_DRAFT
      x-onboarding-required: false
      responses:
        '200':
          description: 성공
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  value:
                    accessToken: mock-access-token-not-a-real-credential
                    tokenType: Bearer
                    expiresAt: '2026-09-19T11:00:00+09:00'
                    expiresInSeconds: 3600
                    refreshSupported: false
                    user:
                      id: 10000000-0000-4000-8000-000000000001
                      email: tester@example.invalid
                      hasOnboarded: false
        '401':
          description: INVALID_CREDENTIALS
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer 인증 실패 응답 challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INVALID_CREDENTIALS:
                  value:
                    code: INVALID_CREDENTIALS
                    message: 이메일 또는 비밀번호가 올바르지 않습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '400':
          description: INVALID_JSON, DUPLICATE_JSON_KEY, INVALID_REQUEST
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INVALID_JSON:
                  value:
                    code: INVALID_JSON
                    message: JSON 형식이 올바르지 않습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                DUPLICATE_JSON_KEY:
                  value:
                    code: DUPLICATE_JSON_KEY
                    message: 중복된 JSON 키가 있습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                INVALID_REQUEST:
                  value:
                    code: INVALID_REQUEST
                    message: 요청 형식이 올바르지 않습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '429':
          description: TOO_MANY_ATTEMPTS
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
            Retry-After:
              schema:
                type: string
                pattern: ^[0-9]+$
              description: 재시도 가능한 경우에만 남은 초. body retryAfterSeconds와 일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                TOO_MANY_ATTEMPTS:
                  value:
                    code: TOO_MANY_ATTEMPTS
                    message: 로그인 시도 횟수를 초과했습니다. 잠시 후 다시 시도해 주세요
                    retryAfterSeconds: 60
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '403':
          description: INVITATION_REQUIRED, ACCOUNT_SUSPENDED, ACCOUNT_CLOSED
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                INVITATION_REQUIRED:
                  value:
                    code: INVITATION_REQUIRED
                    message: 초대된 계정만 사용할 수 있습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                ACCOUNT_SUSPENDED:
                  value:
                    code: ACCOUNT_SUSPENDED
                    message: 이용이 제한된 계정입니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                ACCOUNT_CLOSED:
                  value:
                    code: ACCOUNT_CLOSED
                    message: 종료된 계정입니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        '503':
          description: SERVICE_UNAVAILABLE
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
            Retry-After:
              schema:
                type: string
                pattern: ^[0-9]+$
              description: 재시도 가능한 경우에만 남은 초. body retryAfterSeconds와 일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                SERVICE_UNAVAILABLE:
                  value:
                    code: SERVICE_UNAVAILABLE
                    message: 일시적으로 요청을 처리할 수 없습니다
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
        default:
          description: 예상하지 못한 오류도 동일 ApiError 형식. 실제 성공/실패는 HTTP 상태를 따른다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 'VALIDATION_ERROR: 잘못된 이메일 형식 또는 빈 비밀번호 등 필드 값 오류'
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                VALIDATION_ERROR:
                  value:
                    code: VALIDATION_ERROR
                    message: 입력값을 확인해 주세요
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              emailPassword:
                value:
                  email: tester@example.invalid
                  password: example-only-not-a-real-password
  /v1/config:
    get:
      operationId: getConfig
      summary: 고정 반경·제한·정기 배달 설정
      tags:
      - Config
      description: 새 경로 채택 제안. 인증·초대 허용 계정이면 온보딩 전 조회 가능. 예시의1000m와 모든 제한/중심좌표는 MOCK 전용. 실제 운영값을 서버가 내려주며 누락 시503,
        FE가1000m를 추정해 사용하지 않는다.
      x-contract-status: PROPOSED
      x-onboarding-required: false
      responses:
        '200':
          description: 성공
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
            X-Request-Id:
              schema:
                type: string
              description: 서버 추적 식별자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConfig'
              examples:
                mockOnly:
                  value:
                    configVersion: mock-config-v1
                    radiusMeters: 1000
                    demoCenter:
                      lat: 37.6109
                      lng: 126.9977
                    deliveryTimeZone: Asia/Seoul
                    deliveryLocalTime: 09:00
                    limits:
                      memoryContentMaxCodePoints: 3000
                      preferenceDescriptionMaxCodePoints: 1000
                      reportDetailsMaxCodePoints: 1000
                      imageMaxBytes: 5242880
                      imageMaxWidth: 6000
                      imageMaxHeight: 6000
                      imageMaxPixels: 20000000
                      imageUploadTtlSeconds: 1800
                      analysisTtlSeconds: 900
                      dailyDirectMemoryLimit: 20
                      defaultPageLimit: 20
                      maxPageLimit: 50
                      maxMapPageLimit: 200
                    auth:
                      mode: EMAIL_PASSWORD
                      refreshSupported: false
                      accessTokenTtlSeconds: 3600
                      failedLoginLimit: 5
                      loginLockSeconds: 60
