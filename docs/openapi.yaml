              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
              examples:
                uploaded:
                  value:
                    imageId: 50000000-0000-4000-8000-000000000001
                    expiresAt: '2026-09-19T11:30:00+09:00'
                    mediaType: image/jpeg
                    sizeBytes: 245760
                    width: 1280
                    height: 960
