      summary: JPEG/PNG1장 선행 업로드
      tags:
      - Images
      description: file 파트 하나. 서버가 실제 포맷·바이트·픽셀 수를 확인하고 재인코딩/EXIF 제거한 결과만 저장한다. Security 인증 뒤 설정/전송 gate가 multipart parser보다 먼저 실행된다.
        서비스 설정 또는 양수 multipart 오버헤드가 없으면 CONFIGURATION_UNAVAILABLE(503)이며, 무인증 요청은 먼저401이다. 확실한 롤백의 새 파일만 정리하고 만료 파일의 주기적 정리는 제공하지 않는다.
      x-contract-status: PROPOSED
      x-onboarding-required: true
      responses:
        '201':
          description: 성공 (최초 생성)
          headers:
            Cache-Control:
              schema:
                type: string
              description: 개인 응답은 private, no-store
