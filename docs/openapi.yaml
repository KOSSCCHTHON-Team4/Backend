                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                TOKEN_EXPIRED:
                  value:
                    code: TOKEN_EXPIRED
                    message: 로그인이 만료되었습니다. 다시 로그인해 주세요
                    retryAfterSeconds: null
                    fieldErrors: []
                    requestId: 80000000-0000-4000-8000-000000000001
                INVALID_TOKEN:
                  value:
